# ==============================================================================
# Nginx Reverse Proxy Configuration for Ukweli Journal
# Maps external requests (port 80/443) -> internal Port 888
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name journal.ukweli.org localhost;

    # Maximum upload size for manuscripts & galleys
    client_max_body_size 128M;

    # Performance buffers
    client_body_buffer_size 128k;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
    proxy_buffers 32 4k;

    location / {
        proxy_pass http://127.0.0.1:888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for big streaming downloads
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    # Static asset caching helper
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
